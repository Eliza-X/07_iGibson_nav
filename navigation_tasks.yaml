# 共用现有地图、机器人、规划和控制参数；单项任务禁止覆盖它们。
base_config: fixed_point_path.yaml
# 截图坐标按从 0 开始的（列，行）换算，假设地图为 100×100、分辨率为 0.1 米/格。
# XY = ((列 - 50) * 0.1, (行 - 50) * 0.1)；实际地图尺寸及可达性尚待确认。
# Z 无法由二维栅格确定，起终点高度和初始朝向暂沿用原正向任务配置，待场景验证。
tasks:
