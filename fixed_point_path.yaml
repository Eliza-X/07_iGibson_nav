# Static path planning only. Coordinates below are candidates from the existing
# repository; the program validates them against the loaded Rs navigation graph.
scene: gibson
scene_id: Rs
build_graph: true
floor_num: 0
trav_map_resolution: 0.1
trav_map_erosion: 2
planner_connectivity: 8  # 4: 上下左右；8: 包含对角方向
planner_allow_corner_cutting: false  # 对角移动要求两侧栅格均可通行
# The entry sets waypoint_resolution equal to trav_map_resolution (dense path).
waypoint_resolution: 0.1
load_texture: True
pybullet_load_texture: True
enable_shadow: false
enable_pbr: false

initial_pos: [0.5, -2.5, 0.02072859]
target_pos: [-0.3, 0.3, -0.00876713]
output_dir: outputs/path_planning

# iGibsonEnv loads a robot/task, but the plotting entry never resets or steps it.
robot:
  name: Turtlebot
  action_type: continuous
  action_normalize: true
  base_name: null
  scale: 1.0
  self_collision: false
  rendering_params: null
  controller_config:
    base:
      name: DifferentialDriveController
task: point_nav_fixed
initial_orn: [0.0, 0.0, 1.57079632679]
turn_direction: shortest  # shortest: 最短角度转向；left: 固定左转；right: 固定右转
angular_action_sign: -1.0  # 实测负指令使 yaw 增大；映射策略转向到环境动作
goal_format: polar
task_obs_dim: 4
reward_type: l2
collision_reward_weight: -0.1
dist_tol: 0.1
max_step: 500000
# 执行入口使用此预算；max_step 保留给其他直接读取配置的调用。
execution_max_step: 5000
max_collisions_allowed: 500
initial_pos_z_offset: 0.1
collision_ignore_link_a_ids: [1, 2, 3, 4]  # ignore collisions with these robot links
output: [task_obs]
image_width: 128
image_height: 128
vertical_fov: 45
visible_target: false
visible_path: false

# video: 四宫格预览并录制 MP4；classic: 原有 Viewer 和独立地图，不录像。
display_mode: classic
video_output_dir: outputs/videos
video_panel_width: 640
video_panel_height: 480
video_final_hold_seconds: 2.0
# 固定机位初始候选（世界 XYZ，米），需在 Rs 中预览确认遮挡情况。
fixed_camera_position: [1.3, -3.0, 2.2]
fixed_camera_target: [0.2, -1.2, 0.25]
